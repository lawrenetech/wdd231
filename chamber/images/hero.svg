<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a2e"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#3b6799"/>
    </linearGradient>
    <linearGradient id="bldg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a2e"/>
      <stop offset="100%" stop-color="#0b1a2e" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Distant skyline -->
  <g fill="url(#bldg1)">
    <rect x="100" y="500" width="80" height="400"/>
    <rect x="200" y="420" width="60" height="480"/>
    <rect x="280" y="550" width="90" height="350"/>
    <rect x="390" y="470" width="70" height="430"/>
    <rect x="480" y="380" width="100" height="520"/>
    <rect x="600" y="520" width="80" height="380"/>
    <rect x="700" y="440" width="60" height="460"/>
    <rect x="780" y="560" width="90" height="340"/>
    <rect x="890" y="400" width="70" height="500"/>
    <rect x="980" y="480" width="100" height="420"/>
    <rect x="1100" y="540" width="80" height="360"/>
    <rect x="1200" y="460" width="90" height="440"/>
    <rect x="1310" y="510" width="70" height="390"/>
    <rect x="1400" y="420" width="100" height="480"/>
    <rect x="1520" y="550" width="80" height="350"/>
  </g>

  <!-- Windows -->
  <g fill="#fbbf24" opacity="0.8">
    <rect x="120" y="520" width="10" height="10"/>
    <rect x="150" y="540" width="10" height="10"/>
    <rect x="310" y="580" width="10" height="10"/>
    <rect x="410" y="500" width="10" height="10"/>
    <rect x="500" y="420" width="12" height="12"/>
    <rect x="620" y="550" width="10" height="10"/>
    <rect x="810" y="590" width="10" height="10"/>
    <rect x="910" y="440" width="10" height="10"/>
    <rect x="1010" y="520" width="10" height="10"/>
    <rect x="1220" y="490" width="10" height="10"/>
    <rect x="1420" y="450" width="12" height="12"/>
    <rect x="1540" y="580" width="10" height="10"/>
  </g>

  <!-- Ground -->
  <rect y="860" width="1600" height="40" fill="#0b1a2e"/>
</svg>