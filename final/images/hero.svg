<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A colorful spread of Nigerian dishes including jollof rice, egusi soup, suya, and puff puff">
    <defs>
        <!-- Table gradient background -->
        <linearGradient id="tableBg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7f1d1d"/>
            <stop offset="60%" stop-color="#b91c1c"/>
            <stop offset="100%" stop-color="#450a0a"/>
        </linearGradient>

        <!-- Warm glow -->
        <radialGradient id="glow" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
        </radialGradient>

        <!-- Rice texture -->
        <pattern id="rice" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#fb923c" opacity="0.7"/>
            <circle cx="6" cy="5" r="1" fill="#f97316" opacity="0.6"/>
            <circle cx="4" cy="7" r="1" fill="#ea580c" opacity="0.5"/>
        </pattern>

        <!-- Palm oil texture -->
        <pattern id="palmOil" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
            <circle cx="5" cy="5" r="2" fill="#dc2626" opacity="0.4"/>
        </pattern>

        <!-- Suya spice dots -->
        <pattern id="spice" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
            <circle cx="3" cy="3" r="1" fill="#78350f" opacity="0.8"/>
        </pattern>
    </defs>

    <!-- Background table -->
    <rect width="1600" height="900" fill="url(#tableBg)"/>
    <rect width="1600" height="900" fill="url(#glow)"/>

    <!-- Decorative concentric pattern at bottom -->
    <g opacity="0.08" stroke="#fbbf24" fill="none" stroke-width="2">
        <circle cx="800" cy="900" r="300"/>
        <circle cx="800" cy="900" r="400"/>
        <circle cx="800" cy="900" r="500"/>
        <circle cx="800" cy="900" r="600"/>
    </g>

    <!-- ================== JOLLOF RICE PLATE (left) ================== -->
    <g transform="translate(280, 480)">
        <!-- Plate shadow -->
        <ellipse cx="0" cy="65" rx="190" ry="35" fill="#1c1917" opacity="0.35"/>
        <!-- Plate rim -->
        <ellipse cx="0" cy="40" rx="180" ry="60" fill="#f5f5f4"/>
        <ellipse cx="0" cy="35" rx="180" ry="60" fill="#e7e5e4"/>
        <!-- Plate inner -->
        <ellipse cx="0" cy="35" rx="150" ry="48" fill="#fafaf9"/>
        <!-- Jollof rice mound -->
        <ellipse cx="0" cy="30" rx="130" ry="40" fill="#ea580c"/>
        <ellipse cx="0" cy="28" rx="130" ry="40" fill="url(#rice)"/>
        <!-- Tomato/pepper chunks -->
        <circle cx="-60" cy="20" r="10" fill="#dc2626"/>
        <circle cx="40" cy="15" r="8" fill="#b91c1c"/>
        <circle cx="-20" cy="40" r="9" fill="#dc2626"/>
        <circle cx="70" cy="35" r="7" fill="#991b1b"/>
        <!-- Garnish: parsley-green flecks -->
        <circle cx="-90" cy="30" r="4" fill="#15803d"/>
        <circle cx="20" cy="-5" r="4" fill="#166534"/>
        <circle cx="95" cy="25" r="3" fill="#15803d"/>
        <!-- Chicken piece on top -->
        <ellipse cx="0" cy="-5" rx="55" ry="25" fill="#a16207"/>
        <ellipse cx="0" cy="-8" rx="55" ry="22" fill="#ca8a04"/>
        <ellipse cx="-15" cy="-10" rx="15" ry="8" fill="#facc15" opacity="0.5"/>
    </g>

    <!-- Label -->
    <text x="280" y="620" font-family="Inter, sans-serif" font-size="22" fill="#fef3c7" text-anchor="middle" font-weight="600" letter-spacing="2">JOLLOF RICE</text>

    <!-- ================== EGUSI SOUP BOWL (center) ================== -->
    <g transform="translate(800, 460)">
        <!-- Bowl shadow -->
        <ellipse cx="0" cy="90" rx="220" ry="40" fill="#1c1917" opacity="0.4"/>
        <!-- Bowl outer -->
        <ellipse cx="0" cy="60" rx="210" ry="70" fill="#78350f"/>
        <ellipse cx="0" cy="50" rx="210" ry="70" fill="#92400e"/>
        <!-- Bowl inner -->
        <ellipse cx="0" cy="45" rx="180" ry="58" fill="#facc15" opacity="0.4"/>
        <!-- Soup surface -->
        <ellipse cx="0" cy="40" rx="175" ry="55" fill="#dc2626"/>
        <ellipse cx="0" cy="38" rx="175" ry="55" fill="url(#palmOil)"/>
        <!-- Egusi seeds (yellow flecks) -->
        <circle cx="-120" cy="30" r="6" fill="#fcd34d"/>
        <circle cx="-60" cy="50" r="7" fill="#fbbf24"/>
        <circle cx="20" cy="55" r="6" fill="#fcd34d"/>
        <circle cx="80" cy="40" r="7" fill="#fbbf24"/>
        <circle cx="130" cy="25" r="6" fill="#fcd34d"/>
        <circle cx="-30" cy="20" r="5" fill="#fde68a"/>
        <circle cx="55" cy="15" r="6" fill="#fde68a"/>
        <!-- Spinach (green leaves) -->
        <ellipse cx="-100" cy="15" rx="18" ry="10" fill="#15803d" transform="rotate(-20 -100 15)"/>
        <ellipse cx="100" cy="20" rx="20" ry="10" fill="#166534" transform="rotate(25 100 20)"/>
        <ellipse cx="0" cy="10" rx="22" ry="10" fill="#14532d" transform="rotate(-10 0 10)"/>
        <!-- Meat pieces -->
        <ellipse cx="-50" cy="35" rx="22" ry="12" fill="#7f1d1d"/>
        <ellipse cx="60" cy="35" rx="20" ry="11" fill="#991b1b"/>
        <ellipse cx="0" cy="30" rx="18" ry="10" fill="#7f1d1d"/>
    </g>

    <text x="800" y="620" font-family="Inter, sans-serif" font-size="22" fill="#fef3c7" text-anchor="middle" font-weight="600" letter-spacing="2">EGUSI SOUP</text>

    <!-- ================== SUYA SKEWERS (right) ================== -->
    <g transform="translate(1320, 460)">
        <!-- Plate shadow -->
        <ellipse cx="0" cy="70" rx="180" ry="35" fill="#1c1917" opacity="0.35"/>
        <!-- Round platter -->
        <ellipse cx="0" cy="55" rx="170" ry="55" fill="#d6d3d1"/>
        <ellipse cx="0" cy="50" rx="170" ry="55" fill="#e7e5e4"/>
        <ellipse cx="0" cy="45" rx="140" ry="42" fill="#f5f5f4"/>

        <!-- Skewer 1 -->
        <g transform="rotate(-15 0 0)">
            <line x1="-140" y1="30" x2="140" y2="30" stroke="#a16207" stroke-width="3"/>
            <ellipse cx="-100" cy="30" rx="20" ry="12" fill="#7f1d1d"/>
            <ellipse cx="-55" cy="30" rx="22" ry="13" fill="#991b1b"/>
            <ellipse cx="-10" cy="30" rx="22" ry="13" fill="#7f1d1d"/>
            <ellipse cx="35" cy="30" rx="20" ry="12" fill="#991b1b"/>
            <ellipse cx="80" cy="30" rx="18" ry="11" fill="#7f1d1d"/>
        </g>

        <!-- Skewer 2 -->
        <g transform="rotate(10 0 0)">
            <line x1="-140" y1="10" x2="140" y2="10" stroke="#a16207" stroke-width="3"/>
            <ellipse cx="-100" cy="10" rx="18" ry="11" fill="#991b1b"/>
            <ellipse cx="-55" cy="10" rx="20" ry="12" fill="#7f1d1d"/>
            <ellipse cx="-10" cy="10" rx="20" ry="12" fill="#991b1b"/>
            <ellipse cx="35" cy="10" rx="20" ry="12" fill="#7f1d1d"/>
            <ellipse cx="80" cy="10" rx="18" ry="11" fill="#991b1b"/>
        </g>

        <!-- Spice spots -->
        <g fill="url(#spice)">
            <rect x="-140" y="-10" width="280" height="60"/>
        </g>

        <!-- Onion slivers -->
        <ellipse cx="-90" cy="50" rx="18" ry="5" fill="#f5f5f4" opacity="0.7"/>
        <ellipse cx="-20" cy="55" rx="15" ry="4" fill="#f5f5f4" opacity="0.7"/>
        <ellipse cx="60" cy="50" rx="16" ry="5" fill="#f5f5f4" opacity="0.7"/>
    </g>

    <text x="1320" y="620" font-family="Inter, sans-serif" font-size="22" fill="#fef3c7" text-anchor="middle" font-weight="600" letter-spacing="2">SUYA</text>

    <!-- ================== PUFF PUFF BOWL (bottom center-right) ================== -->
    <g transform="translate(1010, 730)">
        <!-- Small bowl shadow -->
        <ellipse cx="0" cy="40" rx="120" ry="25" fill="#1c1917" opacity="0.35"/>
        <!-- Bowl -->
        <ellipse cx="0" cy="25" rx="110" ry="40" fill="#78350f"/>
        <ellipse cx="0" cy="20" rx="110" ry="40" fill="#a16207"/>
        <ellipse cx="0" cy="15" rx="90" ry="32" fill="#fbbf24" opacity="0.5"/>

        <!-- Puff puff balls -->
        <circle cx="-50" cy="5" r="18" fill="#d97706"/>
        <circle cx="-20" cy="-5" r="19" fill="#ca8a04"/>
        <circle cx="15" cy="0" r="18" fill="#d97706"/>
        <circle cx="50" cy="5" r="17" fill="#b45309"/>
        <circle cx="-35" cy="20" r="16" fill="#a16207"/>
        <circle cx="0" cy="22" r="17" fill="#ca8a04"/>
        <circle cx="35" cy="20" r="16" fill="#d97706"/>

        <!-- Highlight dots on balls -->
        <circle cx="-55" cy="-2" r="3" fill="#fde68a" opacity="0.7"/>
        <circle cx="-25" cy="-12" r="3" fill="#fde68a" opacity="0.7"/>
        <circle cx="10" cy="-7" r="3" fill="#fde68a" opacity="0.7"/>
        <circle cx="45" cy="-2" r="3" fill="#fde68a" opacity="0.7"/>
    </g>

    <text x="1010" y="810" font-family="Inter, sans-serif" font-size="20" fill="#fef3c7" text-anchor="middle" font-weight="600" letter-spacing="2">PUFF PUFF</text>

    <!-- ================== PEPPER SOUP (bottom left) ================== -->
    <g transform="translate(510, 740)">
        <ellipse cx="0" cy="40" rx="110" ry="25" fill="#1c1917" opacity="0.35"/>
        <ellipse cx="0" cy="25" rx="105" ry="38" fill="#e7e5e4"/>
        <ellipse cx="0" cy="20" rx="105" ry="38" fill="#f5f5f4"/>
        <ellipse cx="0" cy="15" rx="85" ry="30" fill="#7f1d1d" opacity="0.3"/>
        <!-- Soup surface -->
        <ellipse cx="0" cy="15" rx="85" ry="30" fill="#dc2626"/>
        <ellipse cx="0" cy="13" rx="85" ry="30" fill="#b91c1c" opacity="0.8"/>
        <!-- Pepper flakes -->
        <circle cx="-40" cy="10" r="3" fill="#fbbf24"/>
        <circle cx="0" cy="5" r="3" fill="#fbbf24"/>
        <circle cx="40" cy="12" r="3" fill="#fbbf24"/>
        <circle cx="-20" cy="20" r="3" fill="#fbbf24"/>
        <circle cx="20" cy="22" r="3" fill="#fbbf24"/>
        <!-- Meat pieces -->
        <ellipse cx="-50" cy="15" rx="15" ry="8" fill="#7f1d1d"/>
        <ellipse cx="55" cy="18" rx="14" ry="7" fill="#7f1d1d"/>
    </g>

    <text x="510" y="810" font-family="Inter, sans-serif" font-size="20" fill="#fef3c7" text-anchor="middle" font-weight="600" letter-spacing="2">PEPPER SOUP</text>

    <!-- ================== DRINK GLASS (bottom right) ================== -->
    <g transform="translate(1450, 730)">
        <ellipse cx="0" cy="45" rx="40" ry="10" fill="#1c1917" opacity="0.35"/>
        <!-- Glass -->
        <path d="M -30 -40 L -35 30 L 35 30 L 30 -40 Z" fill="#f5f5f4" opacity="0.9"/>
        <path d="M -28 -35 L -32 28 L 32 28 L 28 -35 Z" fill="#dc2626" opacity="0.8"/>
        <!-- Ice cubes -->
        <rect x="-15" y="-25" width="15" height="15" fill="#ffffff" opacity="0.6" transform="rotate(15 -8 -18)"/>
        <rect x="0" y="-10" width="15" height="15" fill="#ffffff" opacity="0.6" transform="rotate(-20 8 -3)"/>
        <!-- Orange slice on rim -->
        <circle cx="28" cy="-35" r="10" fill="#fb923c"/>
        <circle cx="28" cy="-35" r="6" fill="#fdba74"/>
        <!-- Straw -->
        <rect x="5" y="-60" width="3" height="40" fill="#fbbf24" transform="rotate(20 6 -40)"/>
    </g>

    <text x="1450" y="810" font-family="Inter, sans-serif" font-size="20" fill="#fef3c7" text-anchor="middle" font-weight="600" letter-spacing="2">CHAPMAN</text>

    <!-- ================== DECORATIVE ADINKRA-STYLE MOTIFS ================== -->
    <g opacity="0.15" stroke="#fbbf24" fill="none" stroke-width="1.5">
        <!-- Top-left corner -->
        <circle cx="60" cy="60" r="30"/>
        <circle cx="60" cy="60" r="20"/>
        <circle cx="60" cy="60" r="10"/>
        <!-- Top-right corner -->
        <circle cx="1540" cy="60" r="30"/>
        <circle cx="1540" cy="60" r="20"/>
        <circle cx="1540" cy="60" r="10"/>
    </g>

    <!-- ================== TITLE TEXT ================== -->
    <text x="800" y="150" font-family="Inter, sans-serif" font-size="90" fill="#fef3c7" text-anchor="middle" font-weight="700" letter-spacing="-3">
        LAGOS EATS
    </text>
    <text x="800" y="200" font-family="Inter, sans-serif" font-size="26" fill="#fbbf24" text-anchor="middle" font-weight="600" letter-spacing="6">
        TASTE OF NIGERIA
    </text>

    <!-- Horizontal rule under title -->
    <line x1="600" y1="235" x2="1000" y2="235" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
    <circle cx="800" cy="235" r="5" fill="#fbbf24"/>
    <circle cx="600" cy="235" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="1000" cy="235" r="4" fill="#fbbf24" opacity="0.8"/>
</svg>